openapi: 3.0.3
info:
  title: Kiragu & Mwangi Real Estate Management System API
  version: 1.0.0
  description: |
    Single source of truth for the `/api` backend. Frontends (`/web`, `/admin`) build against a mock
    generated from this file while `/api` is implemented. Any change to this file goes through a PR
    that is approved by both a frontend and a backend member.

    ## Access levels
    | Code | Meaning |
    |------|---------|
    | P | Public, no login |
    | U | Any logged-in user (client, admin or superadmin) |
    | A | Admin or superadmin |
    | S | Superadmin only |

    ## Conventions
    - JSON bodies use `camelCase`. Dates are `YYYY-MM-DD`, times are `HH:mm` (24h, Africa/Nairobi),
      timestamps are ISO 8601 UTC.
    - Authentication is an HttpOnly cookie named `session`. Browser clients must send
      `credentials: "include"`; the API must allow the web and admin origins in CORS with credentials.
      State-changing requests rely on `SameSite=Lax` (or `None; Secure` when hosted on different sites).
    - Every error uses the `Error` shape. Validation errors list fields in `error.details`.
    - Every list endpoint returns `{ items, page, limit, total }`. Defaults: `page=1`, `limit=20`, max `limit=100`.
    - Audit logging is done by the server, never by clients. Logged: login, logout, and every create,
      update, delete and status change.

    ## Status workflows
    - Booking: `pending` -> `confirmed` | `rescheduled` | `cancelled` | `completed`;
      `confirmed` -> `rescheduled` | `cancelled` | `completed`;
      `rescheduled` -> `confirmed` | `cancelled` | `completed`.
      `completed` and `cancelled` are final. Illegal moves return 422.
    - Valuation: `submitted` -> `under_review` -> `completed`. No skipping, no going back. Illegal moves return 422.

    ## Booking slots
    One-hour slots from 09:00 to 16:00 (last slot starts 16:00), Monday to Saturday. A slot is unavailable when the
    property already has a non-cancelled booking at that date and time. Dates in the past are invalid.
    A client may not hold two active bookings for the same property.

    ## Schema decisions in this contract (need DB changes)
    1. New `notifications` table (see `Notification`).
    2. New `admin_notes` column on `valuation_requests`.
    3. `users.role` values are `client`, `admin`, `superadmin` (max 10 characters).
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://REPLACE-WITH-DEPLOYED-HOST
    description: Deployed API
tags:
  - name: Auth
  - name: Users
  - name: Properties
  - name: Dashboard
  - name: Bookings
  - name: Valuations
  - name: Notifications
  - name: Audit logs
  - name: Reports
  - name: Health

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a client account (P)
      description: Always creates a user with role `client`. Hashes the password and sets the session cookie.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in (P)
      description: Rate limited. Deactivated accounts are rejected with 403.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (any)
      description: Clears the session cookie. Succeeds even when not logged in.
      operationId: logout
      security: []
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user (U)
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link (P)
      description: Always returns the same 200 message whether or not the email exists. Sends the reset link by email.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with a token (P)
      description: The token is valid for 1 hour and single use.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          description: Token invalid or expired, or password fails validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [Users]
      summary: List users (A)
      operationId: listUsers
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          description: Matches name, email or phone number.
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a user (A)
      description: |
        Admins may only create `client` users. Only a superadmin may set `admin` or `superadmin`;
        anyone else sending those roles gets 403.
      operationId: createUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phoneNumber, password, role]
              properties:
                fullName:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 150
                phoneNumber:
                  type: string
                  maxLength: 20
                password:
                  $ref: '#/components/schemas/Password'
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role (S)
      description: A superadmin cannot change their own role.
      operationId: updateUserRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/active:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (A)
      description: Admins cannot deactivate admins or superadmins, or themselves.
      operationId: updateUserActive
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Set a new password for a user (A)
      description: 'Same hierarchy rule as `/active`: admins cannot reset another admin''s password.'
      operationId: adminResetUserPassword
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/properties:
    get:
      tags: [Properties]
      summary: Browse and filter properties (P)
      description: |
        Authentication is optional. Anonymous callers and clients only ever get `status=available`, whatever
        they pass. Admins may pass any status.
      operationId: listProperties
      security:
        - {}
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          description: Matches title, description or location.
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: listingType
          in: query
          schema:
            $ref: '#/components/schemas/ListingType'
        - name: location
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: status
          in: query
          description: Defaults to `available`. Ignored for non-admins.
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, priceAsc, priceDesc]
            default: newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of properties. Each item carries only its primary image; use the detail endpoint for all images.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Properties]
      summary: Create a property with images (A)
      description: Multipart. Up to 8 images, 5 MB each, jpg/png/webp. The first image is the primary one unless changed later.
      operationId: createProperty
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/PropertyInput'
                - type: object
                  properties:
                    images:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        format: binary
      responses:
        '201':
          description: Property created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: An image exceeds 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/properties/{id}:
    get:
      tags: [Properties]
      summary: One property with all images (P)
      description: Non-available properties return 404 to non-admins.
      operationId: getProperty
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Properties]
      summary: Update a property (A)
      description: JSON body. Any property field; only the fields sent are changed. Images are managed via the image endpoints.
      operationId: updateProperty
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: Updated property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Properties]
      summary: Delete a property (A)
      description: Returns 409 if the property has bookings. Remove its images from storage as well.
      operationId: deleteProperty
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/properties/{id}/images:
    post:
      tags: [Properties]
      summary: Add images to a property (A)
      description: The total number of images per property may not exceed 8 (400 otherwise).
      operationId: addPropertyImages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: The images that were added.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: An image exceeds 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/properties/{id}/images/{imageId}:
    delete:
      tags: [Properties]
      summary: Delete an image (A)
      description: Removes the file and the row. If the primary image is deleted, the oldest remaining image becomes primary.
      operationId: deletePropertyImage
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ImageIdPath'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/properties/{id}/images/{imageId}/primary:
    patch:
      tags: [Properties]
      summary: Set the primary image (A)
      description: Exactly one image per property is primary; the previous primary is unset.
      operationId: setPrimaryImage
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ImageIdPath'
      responses:
        '200':
          description: Updated image list for the property.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Dashboard figures (A)
      operationId: getDashboardStats
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Aggregate counts for the admin dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/bookings/availability:
    get:
      tags: [Bookings]
      summary: Slot grid for a date (P)
      operationId: getBookingAvailability
      parameters:
        - name: propertyId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      security: []
      responses:
        '200':
          description: Every slot of the day with its availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings:
    get:
      tags: [Bookings]
      summary: List all bookings (A)
      operationId: listBookings
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: from
          in: query
          description: Viewing date on or after.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Viewing date on or before.
          schema:
            type: string
            format: date
        - name: propertyId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of bookings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Bookings]
      summary: Book a site viewing (U)
      description: Creates a `pending` booking for the caller, writes an audit log and a notification, and triggers the WhatsApp message to admins.
      operationId: createBooking
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, viewingDate, viewingTime]
              properties:
                propertyId:
                  type: integer
                viewingDate:
                  type: string
                  format: date
                viewingTime:
                  $ref: '#/components/schemas/TimeOfDay'
                clientNotes:
                  type: string
      responses:
        '201':
          description: Booking created as `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slot already taken, or the caller already has an active booking for this property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bookings/mine:
    get:
      tags: [Bookings]
      summary: The caller's bookings (U)
      description: Newest first.
      operationId: listMyBookings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All bookings of the caller (no pagination).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel a booking (U or A)
      description: The owner may cancel their own active booking (`pending`, `confirmed`, `rescheduled`). An admin may cancel any active booking.
      operationId: cancelBooking
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cancelled booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/bookings/{id}/confirm:
    patch:
      tags: [Bookings]
      summary: Confirm a booking (A)
      operationId: confirmBooking
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotesBody'
      responses:
        '200':
          description: Confirmed booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/bookings/{id}/reschedule:
    patch:
      tags: [Bookings]
      summary: Reschedule a booking (A)
      description: Validates the new slot like a new booking (409 if taken). Sets status to `rescheduled`.
      operationId: rescheduleBooking
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [viewingDate, viewingTime]
              properties:
                viewingDate:
                  type: string
                  format: date
                viewingTime:
                  $ref: '#/components/schemas/TimeOfDay'
                adminNotes:
                  type: string
      responses:
        '200':
          description: Rescheduled booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
