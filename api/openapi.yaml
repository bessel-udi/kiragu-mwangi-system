          $ref: '#/components/responses/ReportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/valuations:
    get:
      tags: [Reports]
      summary: Valuations report (A)
      operationId: reportValuations
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ValuationStatus'
      responses:
        '200':
          $ref: '#/components/responses/ReportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/listings:
    get:
      tags: [Reports]
      summary: Listings report (A)
      operationId: reportListings
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
      responses:
        '200':
          $ref: '#/components/responses/ReportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/health:
    get:
      tags: [Health]
      summary: Health check (P)
      operationId: health
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly session cookie set by login or register.

  headers:
    SetCookie:
      description: Sets or clears the `session` cookie (HttpOnly, SameSite, Secure when on HTTPS).
      schema:
        type: string

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [pdf, csv]

  responses:
    MessageOk:
      description: Success with a human-readable message.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
    ReportFile:
      description: The generated report as a file download.
      headers:
        Content-Disposition:
          description: 'attachment; filename="<report>-<date>.<pdf|csv>"'
          schema:
            type: string
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        text/csv:
          schema:
            type: string
            format: binary
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request
              details:
                - field: email
                  message: Must be a valid email
    Unauthorized:
      description: Not logged in, or the credentials are wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Logged in but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with existing data (duplicate email, taken slot, property has bookings).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The action is not allowed from the current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable, for example VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INVALID_TRANSITION, RATE_LIMITED.
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Total matching rows across all pages.

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72

    Role:
      type: string
      enum: [client, admin, superadmin]

    PropertyCategory:
      type: string
      enum: [residential, commercial, land]

    ListingType:
      type: string
      enum: [sale, rent]

    PropertyStatus:
      type: string
      enum: [available, under_offer, sold, rented, withdrawn]

    BookingStatus:
      type: string
      enum: [pending, confirmed, rescheduled, completed, cancelled]

    ValuationStatus:
      type: string
      enum: [submitted, under_review, completed]

    ValuationPurpose:
      type: string
      enum: [sale, purchase, mortgage, insurance, investment, other]

    TimeOfDay:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '10:00'

    RegisterRequest:
      type: object
      required: [fullName, email, phoneNumber, password]
      properties:
        fullName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        phoneNumber:
          type: string
          maxLength: 20
          description: Used for WhatsApp, include country code, for example +2547XXXXXXXX.
        password:
          $ref: '#/components/schemas/Password'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      required: [userId, fullName, email, phoneNumber, role, isActive, createdAt]
      properties:
        userId:
          type: integer
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PropertyInput:
      type: object
      required: [title, category, listingType, location, price]
      properties:
        title:
          type: string
          maxLength: 150
        description:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        listingType:
          $ref: '#/components/schemas/ListingType'
        location:
          type: string
          maxLength: 120
        price:
          type: number
          minimum: 0
          description: KES.
        bedrooms:
          type: integer
          minimum: 0
        bathrooms:
          type: integer
          minimum: 0
        sizeSqft:
          type: number
          minimum: 0
        status:
          $ref: '#/components/schemas/PropertyStatus'

    PropertyUpdate:
      type: object
      description: Same fields as PropertyInput, all optional.
      properties:
        title:
          type: string
          maxLength: 150
        description:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        listingType:
          $ref: '#/components/schemas/ListingType'
        location:
          type: string
          maxLength: 120
        price:
          type: number
          minimum: 0
        bedrooms:
          type: integer
          minimum: 0
        bathrooms:
          type: integer
          minimum: 0
        sizeSqft:
          type: number
          minimum: 0
        status:
          $ref: '#/components/schemas/PropertyStatus'

    PropertyImage:
      type: object
      required: [imageId, propertyId, imageUrl, isPrimary, uploadedAt]
      properties:
        imageId:
          type: integer
        propertyId:
          type: integer
        imageUrl:
          type: string
          description: Absolute URL, or a path served by the API.
        isPrimary:
          type: boolean
        uploadedAt:
          type: string
          format: date-time

    Property:
      allOf:
        - $ref: '#/components/schemas/PropertyInput'
        - type: object
          required: [propertyId, status, createdBy, createdAt, updatedAt]
          properties:
            propertyId:
              type: integer
            status:
              $ref: '#/components/schemas/PropertyStatus'
            createdBy:
              type: integer
              description: userId of the admin who created it.
            primaryImageUrl:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PropertyDetail:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          required: [images]
          properties:
            images:
              type: array
              items:
                $ref: '#/components/schemas/PropertyImage'

    Availability:
      type: object
      required: [propertyId, date, slots]
      properties:
        propertyId:
          type: integer
        date:
          type: string
          format: date
        slots:
          type: array
          description: Empty for Sundays and past dates.
          items:
            type: object
            required: [time, available]
            properties:
              time:
                $ref: '#/components/schemas/TimeOfDay'
              available:
                type: boolean

    AdminNotesBody:
      type: object
      properties:
        adminNotes:
          type: string

    Booking:
      type: object
      required: [bookingId, propertyId, userId, viewingDate, viewingTime, status, whatsappSent, createdAt, updatedAt]
      properties:
        bookingId:
          type: integer
        propertyId:
          type: integer
        userId:
          type: integer
        viewingDate:
          type: string
          format: date
        viewingTime:
          $ref: '#/components/schemas/TimeOfDay'
        status:
          $ref: '#/components/schemas/BookingStatus'
        clientNotes:
          type: string
          nullable: true
        adminNotes:
          type: string
          nullable: true
        whatsappSent:
          type: boolean
        property:
          type: object
          description: Summary so lists do not need a second call.
          properties:
            propertyId:
              type: integer
            title:
              type: string
            location:
              type: string
        client:
          type: object
          description: Included for admins only.
          properties:
            userId:
              type: integer
            fullName:
              type: string
            phoneNumber:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Valuation:
      type: object
      required: [valuationId, userId, propertyCategory, location, purpose, status, createdAt, updatedAt]
      properties:
        valuationId:
          type: integer
        userId:
          type: integer
        propertyCategory:
          $ref: '#/components/schemas/PropertyCategory'
        location:
          type: string
        lrNumber:
          type: string
          nullable: true
        approximateSize:
          type: string
          nullable: true
        purpose:
          $ref: '#/components/schemas/ValuationPurpose'
        additionalDetails:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ValuationStatus'
        adminNotes:
          type: string
          nullable: true
        handledBy:
          type: integer
          nullable: true
        client:
          type: object
          description: Included for admins only.
          properties:
            userId:
              type: integer
            fullName:
              type: string
            phoneNumber:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      required: [notificationId, type, message, isRead, createdAt]
      properties:
        notificationId:
          type: integer
        type:
          type: string
          enum: [booking_created, valuation_submitted]
        message:
          type: string
        entityName:
          type: string
          enum: [viewing_bookings, valuation_requests]
        entityId:
          type: integer
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      required: [logId, action, createdAt]
      properties:
        logId:
          type: integer
        userId:
          type: integer
          nullable: true
          description: Null for actions by anonymous users, for example a failed login.
        action:
          type: string
          example: booking.confirm
        entityName:
          type: string
          nullable: true
        entityId:
          type: integer
          nullable: true
        details:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      required: [properties, bookings, valuations, users, unreadNotifications]
      properties:
        properties:
          type: object
          required: [total, available, sold, rented]
          properties:
            total:
              type: integer
            available:
              type: integer
            sold:
              type: integer
            rented:
              type: integer
        bookings:
          type: object
          required: [total, pending, confirmed, upcoming]
          properties:
            total:
              type: integer
            pending:
              type: integer
            confirmed:
              type: integer
            upcoming:
              type: integer
              description: Active bookings dated today or later.
        valuations:
          type: object
          required: [total, submitted, underReview, completed]
          properties:
            total:
              type: integer
            submitted:
              type: integer
            underReview:
              type: integer
            completed:
              type: integer
        users:
          type: object
          required: [total, clients]
          properties:
            total:
              type: integer
            clients:
              type: integer
        unreadNotifications:
          type: integer
