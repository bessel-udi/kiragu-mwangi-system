            type: integer
        - name: action
          in: query
          description: Exact action name, for example `booking.confirm`.
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit logs, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/bookings:
    get:
      tags: [Reports]
      summary: Bookings report (A)
      description: Branded with the Kiragu & Mwangi logo.
      operationId: reportBookings
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFormat'
