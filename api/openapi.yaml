      operationId: closeBooking
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotesBody'
      responses:
        '200':
          description: Booking with status `completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/valuations:
    get:
      tags: [Valuations]
      summary: List all valuation requests (A)
      operationId: listValuations
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ValuationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of valuation requests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Valuation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Valuations]
      summary: Submit a valuation request (U)
      description: Creates a request with status `submitted`, writes an audit log and a notification, and triggers the WhatsApp message to admins.
      operationId: createValuation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyCategory, location, purpose]
              properties:
                propertyCategory:
                  $ref: '#/components/schemas/PropertyCategory'
                location:
                  type: string
                  maxLength: 150
                lrNumber:
                  type: string
                  maxLength: 50
                approximateSize:
                  type: string
                  maxLength: 50
                purpose:
                  $ref: '#/components/schemas/ValuationPurpose'
                additionalDetails:
                  type: string
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/valuations/mine:
    get:
      tags: [Valuations]
      summary: The caller's valuation requests (U)
      description: Newest first.
      operationId: listMyValuations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All requests of the caller (no pagination). `adminNotes` is included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valuation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/valuations/{id}/status:
    patch:
      tags: [Valuations]
